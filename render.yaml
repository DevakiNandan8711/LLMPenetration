# Render Blueprint — deploy both services from one repo
# Docs: https://render.com/docs/blueprint-spec
#
# Usage:
#   1. Push this file to your repo
#   2. Go to https://dashboard.render.com → New → Blueprint
#   3. Connect your repo → Render creates both services automatically
#   4. Set GROQ_API_KEY in the hacksynth-api service environment

services:
  # ── Backend (FastAPI) ──────────────────────────────────────
  - type: web
    name: hacksynth-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false                    # Render prompts you to enter this
      - key: DEMO_MODE
        value: "false"
      - key: USE_MOCK_EXECUTOR
        value: "true"                  # Render has no Docker socket
      - key: COMMAND_TIMEOUT_SEC
        value: "120"
      - key: DEFAULT_MAX_STEPS
        value: "24"

  # ── Frontend (React + Nginx) ───────────────────────────────
  - type: web
    name: hacksynth-ui
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: API_URL
        fromService:
          name: hacksynth-api
          type: web
          env: public_url
      - key: VITE_API_URL
        fromService:
          name: hacksynth-api
          type: web
          env: public_url
